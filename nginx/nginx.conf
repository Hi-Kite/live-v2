worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Docker's embedded DNS. Combined with variable proxy_pass below this
    # forces per-request re-resolution, so nginx keeps working when a
    # single service is rebuilt/recreated (its container IP changes).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compress text assets (never video — FLV/TS/M3U8 gain nothing).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- HTTP: ACME challenges + redirect to HTTPS ----
    server {
        listen 80;
        server_name _;
        # Let's Encrypt webroot — docker-compose mounts ./nginx/certbot here.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- HTTPS main site ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Cert paths — mount real certs into ./nginx/certs/
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Upstreams as variables => resolved per request via the resolver
        # above (static upstream{} blocks pin IPs at startup and go stale).
        set $backend_upstream  http://backend:3001;
        set $frontend_upstream http://frontend:3000;
        set $srs_upstream      http://srs:8080;

        # WebSocket for Socket.IO
        location /socket.io/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Backend API
        location /api/ {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HTTP-FLV playback: /streams/live/<slug>.flv -> srs /live/<slug>.flv
        # (kept under /streams/live/ so the Nuxt watch pages at
        # /streams/<slug> are untouched)
        location ~ ^/streams/live/(.+\.flv)$ {
            proxy_pass $srs_upstream/live/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;              # critical for live streaming
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # HLS playback: /streams/live/<slug>.m3u8 + segments — short cache
        location ~ ^/streams/live/(.+\.(?:m3u8|ts))$ {
            proxy_pass $srs_upstream/live/$1$is_args$args;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache" always;
            # add_header in a location suppresses inherited headers — re-add
            add_header Strict-Transport-Security "max-age=15552000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # Legacy direct SRS paths (/live/<slug>.flv|.m3u8) — same upstream.
        location /live/ {
            proxy_pass $srs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else -> Nuxt SSR
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
