worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- upstreams (internal docker network) ----
    upstream nuxt_upstream { server frontend:3000; }
    upstream api_upstream  { server backend:3001; }
    upstream srs_http_upstream { server srs:8080; }

    # ---- HTTP: redirect to HTTPS (comment this server block if no cert yet) ----
    server {
        listen 80;
        server_name _;
        # Allow Let's Encrypt / ACME challenges if you later add certbot
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- HTTPS main site ----
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Cert paths — mount real certs into ./nginx/certs/
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # WebSocket for Socket.IO
        location /socket.io/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # Backend API
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SRS HTTP-FLV / HLS streams (e.g. /live/<key>.flv)
        location /live/ {
            proxy_pass http://srs_http_upstream;
            proxy_set_header Host $host;
            proxy_buffering off;          # critical for streaming
            proxy_read_timeout 3600s;
        }

        # Everything else -> Nuxt SSR
        location / {
            proxy_pass http://nuxt_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
